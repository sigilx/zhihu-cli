[package]
name = "zhihu-cli"
version = "0.1.0"
edition = "2021"
description = "知乎命令行工具 — 在终端搜索、阅读、互动"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "zhihu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "6"
ego-tree = "0.10"
hmac = "0.12"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10"
qrcode = "0.14"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "gzip", "brotli", "deflate", "rustls-tls"] }
scraper = "0.22"
serde_json = "1"
sha1 = "0.10"
terminal_size = "0.4"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
